# Kubernetes部署配置
# Paper Agent系统 - 云原生部署

apiVersion: v1
kind: ConfigMap
metadata:
  name: paper-agent-config
  labels:
    app: paper-agent
data:
  LOG_LEVEL: "INFO"
  WORKERS: "4"
  # 数据库配置将在Secret中管理

---
apiVersion: v1
kind: Secret
metadata:
  name: paper-agent-secrets
type: Opaque
stringData:
  OPENAI_API_KEY: "your-openai-api-key"
  ANTHROPIC_API_KEY: "your-anthropic-api-key"
  MINIMAX_API_KEY: "your-minimax-api-key"
  POSTGRES_PASSWORD: "paperagent"
  NEO4J_PASSWORD: "paperagent"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paper-agent
  labels:
    app: paper-agent
spec:
  replicas: 3
  selector:
    matchLabels:
      app: paper-agent
  template:
    metadata:
      labels:
        app: paper-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: paper-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: paper-agent
          image: paper-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: paper-agent-config
            - secretRef:
                name: paper-agent-secrets
          env:
            - name: POSTGRES_URI
              value: "postgresql://paper:paper@postgres-svc:5432/paperagent"
            - name: REDIS_URL
              value: "redis://redis-svc:6379"
            - name: NEO4J_URI
              value: "bolt://neo4j-svc:7687"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: output
              mountPath: /app/output
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paper-agent-data
        - name: output
          persistentVolumeClaim:
            claimName: paper-agent-output
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - paper-agent
                topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: paper-agent-svc
  labels:
    app: paper-agent
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: paper-agent

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paper-agent-ingress
  labels:
    app: paper-agent
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
    - hosts:
        - paper-agent.example.com
      secretName: paper-agent-tls
  rules:
    - host: paper-agent.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paper-agent-svc
                port:
                  number: 8000

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paper-agent-data
  labels:
    app: paper-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paper-agent-output
  labels:
    app: paper-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paper-agent-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paper-agent
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80