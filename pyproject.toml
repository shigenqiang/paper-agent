[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-agent"
version = "0.1.0"
description = "论文知识库分析 Agent"
readme = "readme.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "openai>=1.0",
    "httpx>=0.27",
    "aiohttp>=3.8",
    "requests>=2.28",
    "pdfplumber>=0.10",
    "arxiv>=1.4",
    "biopython>=1.81",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "orjson>=3.8",
    "loguru>=0.7",
    "psycopg2-binary>=2.9",
    "chromadb>=0.4",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]

[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    "pre-commit>=3.6",
]
test = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.24"]
lint = ["ruff>=0.9", "mypy>=1.14"]

# === Ruff (统一 lint + format) ===

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "S",    # flake8-bandit (安全)
    "A",    # flake8-builtins
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RUF",  # Ruff 特有规则
    "TCH",  # TYPE_CHECKING 导入优化
    "T20",  # 检测 print 语句
    "LOG",  # flake8-logging
]
ignore = [
    "E501",  # 行长度由 formatter 处理
    "S101",  # 允许 assert（测试中）
    "B008",  # 允许函数默认参数中的调用
    "SIM108", # 允许 if-else 而非三元表达式
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "T20"]
"scripts/**/*.py" = ["T20"]
"demos/**/*.py" = ["T20"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

# === Mypy (类型检查) ===

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
show_error_codes = true
ignore_missing_imports = true

# === Pytest ===

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
