# ============================================
# Paper Agent Docker Compose
# ============================================
# - Storage: PostgreSQL + Qdrant
# - API: FastAPI + Uvicorn
# - Frontend: React + Nginx
# - LLM: 可配置 (LLMService)
# ============================================

version: '3.8'

services:
  # ---- 结构化存储 ----
  postgres:
    image: postgres:16
    container_name: paper-agent-postgres
    environment:
      - POSTGRES_DB=paper_agent
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paper-network

  # ---- 向量存储 ----
  qdrant:
    image: qdrant/qdrant:latest
    container_name: paper-agent-qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paper-network

  # ---- 前端 ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paper-agent-frontend
    ports:
      - "3000:80"
    depends_on:
      paper-agent:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - paper-network

  # ---- 主服务 ----
  paper-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: paper-agent
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      # 数据库配置
      - PAPER_AGENT_DB_DSN=postgresql://postgres:postgres@postgres:5432/paper_agent
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # API配置
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      # 代理配置
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      # 日志配置
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    volumes:
      # 数据持久化
      - paper-data:/app/data
      - paper-output:/app/output
      # 插件目录（可选挂载）
      - ./plugins:/app/plugins:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    networks:
      - paper-network

  # ============================================
  # 可选监控栈 (需要时启用)
  # 使用: docker-compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
  # ============================================

  prometheus:
    image: prom/prometheus:latest
    container_name: paper-agent-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - paper-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: paper-agent-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - paper-network
    profiles:
      - monitoring

# ============================================
# 已移除的服务
# ============================================
# redis: 代码无引用 (monitoring 模块无实际连接)
# neo4j: 代码在 deprecated/ 目录，已不使用
# ============================================

# ============================================
# 卷定义
# ============================================
volumes:
  postgres-data:
    driver: local
  qdrant-data:
    driver: local
  paper-data:
    driver: local
  paper-output:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ============================================
# 网络定义
# ============================================
networks:
  paper-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16