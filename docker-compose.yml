# ============================================
# Paper Agent Docker Compose - 精简版 (2026-05-03)
# ============================================
# 基于 docs/implemented/architecture 分析:
# - Storage: SQLite + ChromaDB (本地文件)
# - Knowledge Graph: deprecated (代码在 src/agents_v2/knowledge_graph/deprecated/)
# - Monitoring: 内置模块，无外部依赖
# ============================================

version: '3.8'

services:
  # ---- 主服务 ----
  paper-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paper-agent
    environment:
      # API配置
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      # 代理配置
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      # 日志配置
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    volumes:
      # 数据持久化 (SQLite + ChromaDB)
      - paper-data:/app/data
      - paper-output:/app/output
      # 插件目录（可选挂载）
      - ./plugins:/app/plugins:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    networks:
      - paper-network

  # ============================================
  # 可选监控栈 (需要时启用)
  # 使用: docker-compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
  # ============================================

  prometheus:
    image: prom/prometheus:latest
    container_name: paper-agent-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - paper-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: paper-agent-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - paper-network
    profiles:
      - monitoring

# ============================================
# 已移除的服务 (2026-05-03 更新)
# ============================================
# postgres: 代码无引用 (storage 使用 SQLite)
# redis: 代码无引用 (monitoring 模块无实际连接)
# neo4j: 代码在 deprecated/ 目录，已不使用
# ============================================

# ============================================
# 卷定义
# ============================================
volumes:
  paper-data:
    driver: local
  paper-output:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ============================================
# 网络定义
# ============================================
networks:
  paper-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16