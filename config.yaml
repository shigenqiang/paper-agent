# 论文Agent系统配置文件
# 配置优先级: 环境变量 > config.yaml > 默认值

# 日志级别: DEBUG, INFO, WARNING, ERROR
log_level: INFO

# LLM配置
llm:
  provider: openai
  model_name: minimax
  temperature: 0.7
  max_tokens: 4096
  # api_key: 从环境变量或.env文件读取
  # base_url: 可选，自定义API端点

# 缓存配置
cache:
  enabled: true
  ttl: 3600        # 缓存过期时间（秒）
  max_entries: 1000  # 最大缓存条目数

# 限流配置
rate_limit:
  enabled: true
  max_requests: 100  # 每窗口最大请求数
  window_seconds: 60  # 窗口大小（秒）

# 安全配置
security:
  sanitize_input: true   # 是否清理输入
  allow_html: false     # 是否允许HTML
  max_input_length: 10000  # 最大输入长度

# Agent配置
agent:
  max_concurrent: 10   # 最大并发数
  timeout: 300          # 超时时间（秒）
  retry_attempts: 3     # 重试次数

# 数据库配置
database:
  # PostgreSQL 配置
  postgres:
    enabled: true  # 设为 true 启用 PostgreSQL
    host: localhost
    port: 5432
    database: paper_agent
    user: postgres
    password: "postgres"
    # 或者使用 DSN:
    # dsn: "postgresql://user:password@localhost:5432/paper_agent"

  # ChromaDB 配置
  chromadb:
    enabled: true  # 设为 true 启用 ChromaDB
    path: data/chromadb  # 本地存储路径

# 存储后端选择
# 可选值: "json", "postgres"
# json: 使用 JSON 文件存储（默认，无需数据库）
# postgres: 使用 PostgreSQL 存储
storage_backend: postgres

# 向量存储
# 可选值: "none", "chromadb"
# none: 不使用向量存储
# chromadb: 使用 ChromaDB
vector_storage: chromadb
