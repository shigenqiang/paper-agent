# 论文Agent系统配置文件
# 配置优先级: 环境变量 > config.yaml > 默认值

# 日志级别: DEBUG, INFO, WARNING, ERROR
log_level: INFO

# LLM配置
llm:
  provider: openai
  model_name: minimax
  temperature: 0.7
  max_tokens: 4096
  # api_key: 从环境变量或.env文件读取
  # base_url: 可选，自定义API端点

# 缓存配置
cache:
  enabled: true
  ttl: 3600        # 缓存过期时间（秒）
  max_entries: 1000  # 最大缓存条目数

# 限流配置
rate_limit:
  enabled: true
  max_requests: 100  # 每窗口最大请求数
  window_seconds: 60  # 窗口大小（秒）

# 安全配置
security:
  sanitize_input: true   # 是否清理输入
  allow_html: false     # 是否允许HTML
  max_input_length: 10000  # 最大输入长度

# Agent配置
agent:
  max_concurrent: 10   # 最大并发数
  timeout: 300          # 超时时间（秒）
  retry_attempts: 3     # 重试次数

# 数据库配置
database:
  # PostgreSQL 配置
  postgres:
    enabled: true  # 设为 true 启用 PostgreSQL
    host: localhost
    port: 5432
    database: paper_agent
    user: postgres
    password: "postgres"
    # 或者使用 DSN:
    # dsn: "postgresql://user:password@localhost:5432/paper_agent"

  # Qdrant 向量数据库配置
  qdrant:
    enabled: true
    host: localhost
    port: 6333
    collection: paper_chunks
    vector_size: 512
    distance: cosine

# 存储后端选择
# 可选值: "json", "postgres"
storage_backend: postgres

# 向量存储
# 可选值: "none", "qdrant"
vector_storage: qdrant

# 搜索排序配置
search:
  # 来源优先级（越高越优先）
  source_priority:
    openalex: 4
    semantic_scholar: 3
    arxiv: 2
    pubmed: 1

  # BM25 参数
  bm25:
    k1: 1.5        # 词频饱和度
    b: 0.4         # 文档长度归一化

  # 字段权重（用于相关度计算）
  field_weights:
    abstract: 3.5
    title: 2.0
    keywords: 2.0
    concepts: 1.0
    venue: 0.5

  # 最终分数权重
  final_weights:
    relevance: 0.55
    quality: 0.25
    source_priority: 0.20

  # RRF 融合常数
  rrf_k: 60

  # 入库最低分数阈值
  min_import_score: 0.3
